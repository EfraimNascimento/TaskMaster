{% extends "base.html" %}
{% block content %}
<div class="mb-4 animate-in">
    <h2 class="fw-bold m-0">Minhas Tarefas</h2>
    <p style="color: var(--text-muted);">Organize seu dia com foco e produtividade.</p>
</div>

<div class="modern-card mb-5 animate-in delay-1">
    <form action="{{ url_for('tasks.add_task') }}" method="POST" class="d-flex gap-3 flex-column flex-md-row">
        <input type="text" name="title" class="modern-input flex-grow-1" placeholder="O que precisa ser feito hoje?" required autocomplete="off">
        <button type="submit" class="modern-btn modern-btn-primary text-nowrap"><i class="bi bi-plus-lg"></i> Adicionar</button>
    </form>
</div>

<div class="d-flex flex-column gap-3 animate-in delay-2">
    {% for task in tasks %}
    <div class="modern-card hover-lift p-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <i class="{{ 'bi bi-check-circle-fill' if task.status else 'bi bi-circle' }} fs-4 task-status-icon" style="color: {{ 'var(--accent-primary)' if task.status else 'var(--border-subtle)' }};"></i>
            <span class="fs-5 {{ 'task-completed' if task.status else 'task-pending' }} task-title-text">{{ task.title }}</span>
        </div>
        <div class="d-flex gap-2">
            <form action="{{ url_for('tasks.toggle_task', task_id=task.id) }}" method="POST" class="toggle-task-form">
                <button type="submit" class="modern-btn modern-btn-icon {{ 'modern-btn-outline' if task.status else 'modern-btn-primary' }}" title="{{ 'Reabrir' if task.status else 'Completar' }}">
                    <i class="{{ 'bi bi-arrow-counterclockwise' if task.status else 'bi bi-check2' }}"></i>
                </button>
            </form>
            <form action="{{ url_for('tasks.delete_task', task_id=task.id) }}" method="POST">
                <button type="button" class="modern-btn modern-btn-icon modern-btn-danger" title="Excluir" onclick="showConfirmModal(this.closest('form'), 'Excluir Tarefa', 'Deseja excluir permanentemente?')">
                    <i class="bi bi-trash"></i>
                </button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
