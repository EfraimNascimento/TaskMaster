{% extends "base.html" %}
{% block content %}
<div class="glass-card p-4">
    <h2><i class="bi bi-gear"></i> Minhas Configurações</h2>
    <hr>
    <form action="{{ url_for('tasks.user_settings') }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold">Paleta de Cores (Interface)</label>
            <select name="theme" class="form-select glass-input">
                <option value="theme-ocean" {% if current_user.theme == 'theme-ocean' %}selected{% endif %}>Ocean Blue (Claro/Profissional)</option>
                <option value="theme-dark-glass" {% if current_user.theme == 'theme-dark-glass' %}selected{% endif %}>Dark Glass (Noturno/Hacker)</option>
                <option value="theme-sunset" {% if current_user.theme == 'theme-sunset' %}selected{% endif %}>Sunset (Quente/Criativo)</option>
                <option value="theme-amethyst" {% if current_user.theme == 'theme-amethyst' %}selected{% endif %}>Amethyst (Roxo/Moderno)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary glass-btn">Salvar Tema</button>
    </form>
</div>
{% endblock %}
