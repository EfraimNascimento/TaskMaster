{% extends "base.html" %}
{% block content %}
<div class="modern-card animate-in" style="max-width: 600px; margin: 0 auto;">
    <h5 class="fw-bold mb-4"><i class="bi bi-palette"></i> Preferências Visuais</h5>
    <form action="{{ url_for('tasks.user_settings') }}" method="POST">
        <div class="mb-4">
            <label class="form-label fw-bold" style="color: var(--text-muted);">Tema da Interface</label>
            <select name="theme" class="modern-input">
                <option value="theme-light" {% if current_user.theme == 'theme-light' %}selected{% endif %}>Claro Moderno</option>
                <option value="theme-dark" {% if current_user.theme == 'theme-dark' %}selected{% endif %}>Escuro Sofisticado</option>
                <option value="theme-midnight" {% if current_user.theme == 'theme-midnight' %}selected{% endif %}>Midnight Purple</option>
                <option value="theme-ocean" {% if current_user.theme == 'theme-ocean' %}selected{% endif %}>Ocean Blue</option>
                <option value="theme-sunset" {% if current_user.theme == 'theme-sunset' %}selected{% endif %}>Sunset Coral</option>
            </select>
        </div>
        <button type="submit" class="modern-btn modern-btn-primary w-100">Salvar Alterações</button>
    </form>
</div>
{% endblock %}
